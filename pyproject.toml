[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ytxt"
dynamic = ["version"]
description = "Save YouTube captions as text files for reading and discussion."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = ["youtube-transcript-api>=1.2.4,<2", "requests>=2,<3"]

[project.scripts]
ytxt = "ytxt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "ytxt.__version__"}
